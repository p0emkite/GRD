<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRD Creator Studio</title><link rel="stylesheet" href="src/style.css"><style>main.studio{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1200px}.studio label{display:grid;gap:5px;font-size:12px;color:#dfc9ed}.studio input,.studio textarea{width:100%;font:inherit;color:#fff;background:#160e29;border:1px solid #a582c768;border-radius:8px;padding:9px}.studio textarea{min-height:100px;resize:vertical}.studio .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.studio .wide{grid-column:1/-1}.studio .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.studio #groupList{display:grid;gap:5px;max-height:70vh;overflow:auto}.studio #groupList button{text-align:left}.studio #groupList button.active{border-color:#fbc1f6;background:#59376f}.asset-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:9px;align-items:center;padding:8px;border:1px solid #a582c730;border-radius:9px}.asset-row img{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#21152e}.asset-row input[type=file]{font-size:10px;padding:3px}.asset-row .asset-controls{display:grid;gap:4px}.studio .help{font-size:11px;color:#b5a3cd}.studio #memberEditor{display:grid;gap:6px}.studio #status{color:#a6f4d1;min-height:22px}.studio #status.bad{color:#ff9fa8}@media(max-width:760px){main.studio{grid-template-columns:1fr}.studio .fields{grid-template-columns:1fr}.studio #groupList{max-height:210px}}</style></head><body><header><div class="brand"><div class="brand-emblem">✦</div><div><h1>GRD CREATOR STUDIO</h1><small>ARTIST & GROUP MANAGEMENT</small></div></div><a href="index.html" style="color:#ffcfef">게임으로 돌아가기 ↗</a></header><main class="studio"><section class="panel"><div class="head"><h2>그룹 목록</h2></div><div class="actions"><button id="addGroup" class="primary">+ 그룹</button><button id="removeGroup" class="danger">삭제</button></div><div id="groupList"></div></section><section class="panel"><div class="head"><h2 id="editorTitle">그룹 관리</h2><small id="sourceLabel"></small></div><div class="actions"><button id="save" class="primary">저장 · 게임 적용</button><button id="export">JSON 내보내기</button><button id="import">JSON 가져오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div id="status" role="status"></div><div class="fields"><label>그룹 ID<input id="gid" maxlength="64" placeholder="group-id"></label><label>그룹 이름<input id="gname" maxlength="80"></label><label>전투 유형<select id="role"></select></label><label>테마 색상<input type="color" id="color"></label><label><span>유닛 그룹 <input type="checkbox" id="sub" style="width:auto"></span></label><label class="wide">멤버 이름 (한 줄에 한 명)<textarea id="memberNames"></textarea><button id="applyMembers" type="button">멤버 목록 반영</button></label><div class="wide" id="groupAssets"></div><div class="wide"><h3>멤버 사진</h3><div id="memberEditor"></div></div></div><p class="help">파일 업로드 또는 HTTPS 주소 / assets/ 경로 사용. 동일 이름은 동일 인물로 처리합니다. 저장은 같은 브라우저의 게임에 적용됩니다. 전체 공개 배포는 내보낸 catalog.json을 저장소 루트에 커밋하세요. 이미지·음원은 사용 권한이 있는 파일만 등록하세요.</p></section></main><script src="src/data.js"></script><script src="src/catalog.js"></script><script src="src/studio.js"></script></body></html>
