<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRD Creator Studio 2.0</title><link rel="stylesheet" href="src/style.css"><style>main.studio{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1200px}.studio label{display:grid;gap:5px;font-size:12px;color:#dfc9ed}.studio input,.studio textarea{width:100%;font:inherit;color:#fff;background:#160e29;border:1px solid #a582c768;border-radius:8px;padding:9px}.studio textarea{min-height:100px;resize:vertical}.studio .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.studio .wide{grid-column:1/-1}.studio .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.studio #groupList{display:grid;gap:5px;max-height:70vh;overflow:auto}.studio #groupList button{text-align:left}.studio #groupList button.active{border-color:#fbc1f6;background:#59376f}.asset-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:9px;align-items:center;padding:8px;border:1px solid #a582c730;border-radius:9px}.asset-row img{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#21152e}.asset-row input[type=file]{font-size:10px;padding:3px}.asset-row .asset-controls{display:grid;gap:4px}.studio .help{font-size:11px;color:#b5a3cd}.studio #memberEditor{display:grid;gap:6px}.studio #status{color:#a6f4d1;min-height:22px}.studio #status.bad{color:#ff9fa8}@media(max-width:760px){main.studio{grid-template-columns:1fr}.studio .fields{grid-template-columns:1fr}.studio #groupList{max-height:210px}}[hidden]{display:none!important}.auth-panel{max-width:1156px;margin:14px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.auth-panel form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth-panel input{padding:8px;background:#160e29;color:#fff;border:1px solid #a582c768;border-radius:8px}.auth-panel #authState{font-size:12px;color:#d6c2ec}.studio[inert]{opacity:.45;pointer-events:none}.combat-fields{border:1px solid #a582c750;border-radius:9px;padding:12px}.combat-fields summary{margin-bottom:10px}#groupSearch{margin-bottom:9px}dialog{background:#21152f;color:#fff;border:1px solid #d8b1ff;border-radius:12px;padding:16px;max-width:94vw}dialog::backdrop{background:#000c}#cropCanvas{display:block;width:min(360px,75vw);height:auto;border-radius:50%;margin:10px auto}#cropDialog label{display:flex;gap:8px;align-items:center;font-size:12px;margin:8px}#previewDialog{width:min(900px,95vw)}#revealPreview{position:relative;aspect-ratio:16/9;background:radial-gradient(#5e356d,#090410);display:grid;place-items:center;overflow:hidden}#previewArt{position:absolute;width:100%;height:100%;object-fit:cover}#previewTitle{position:absolute;bottom:8%;font-size:clamp(20px,5vw,48px);text-shadow:0 0 20px #000,0 2px 7px #000}#previewDialog.repeat #previewArt{object-fit:contain;width:60%;height:60%}.asset-controls audio{width:100%;height:32px}</style></head><body><header><div class="brand"><div class="brand-emblem">✦</div><div><h1>GRD CREATOR STUDIO</h1><small>CREATOR STUDIO 2.0 · CLOUD</small></div></div><a href="index.html" style="color:#ffcfef">게임으로 돌아가기 ↗</a></header><section class="panel auth-panel"><form id="loginForm"><strong>관리자 로그인</strong><input id="loginName" placeholder="GRD 계정 ID" autocomplete="username" required><input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required><button class="primary" type="submit">로그인</button></form><a href="index.html" style="color:#dfc9ed">GRD 회원가입 →</a><div id="authState" role="status">접속 확인 중</div><button id="logout" hidden>로그아웃</button></section><main class="studio" id="studioMain" inert><section class="panel"><div class="head"><h2>그룹 목록</h2></div><div class="actions"><button id="addGroup" class="primary">+ 그룹</button><button id="removeGroup" class="danger">삭제</button></div><input id="groupSearch" placeholder="그룹·세대·소속사·국가 검색"><div id="groupList"></div></section><section class="panel"><div class="head"><h2 id="editorTitle">그룹 관리</h2><small id="sourceLabel"></small></div><div class="actions"><button id="save" class="primary">저장 · 공개 배포</button><button id="reloadCloud">최신 불러오기</button><button id="importLocal">이전 로컬 데이터</button><button id="export">JSON 내보내기</button><button id="import">JSON 가져오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div id="status" role="status"></div><div class="fields"><label>그룹 ID<input id="gid" maxlength="64" placeholder="group-id"></label><label>그룹 이름<input id="gname" maxlength="80"></label><label>세대<input id="generation" placeholder="예: 4세대"></label><label>소속사<input id="agency"></label><label>국가<input id="country"></label><label>전투 유형<select id="role"></select></label><label>테마 색상<input type="color" id="color"></label><label><span>유닛 그룹 <input type="checkbox" id="sub" style="width:auto"></span></label><label class="wide">멤버 이름 (한 줄에 한 명)<textarea id="memberNames"></textarea><button id="applyMembers" type="button">멤버 목록 반영</button></label><details class="wide combat-fields"><summary>전투 밸런스 · 고유 스킬</summary><div class="fields"><label>기본 공격력<input type="number" id="atk" min="1" max="100000" placeholder="자동"></label><label>공격 간격 (초)<input type="number" id="interval" min=".15" max="10" step=".01" placeholder="자동"></label><label>사거리 (px)<input type="number" id="range" min="40" max="900" placeholder="자동"></label><label>스킬 유형<select id="skillKind"><option value="">기본 스킬</option><option value="tempo">속도</option><option value="blast">광역 폭발</option><option value="pierce">강화 타격</option><option value="critical">치명타</option><option value="freeze">광역 감속</option><option value="cheer">아군 지원</option></select></label><label>스킬명<input id="skillName" maxlength="80"></label><label>발동 공격 횟수<input id="skillEvery" type="number" min="1" max="50" value="5"></label><label>위력 배율<input id="skillPower" type="number" min=".1" max="10" step=".1" value="1.5"></label><label>범위 (px)<input id="skillRadius" type="number" min="20" max="500" value="110"></label></div></details><div class="wide"><button id="previewReveal">최초 등장 미리보기</button> <button id="previewRepeat">반복 등장 미리보기</button></div><div class="wide" id="groupAssets"></div><div class="wide"><h3>멤버 사진</h3><div id="memberEditor"></div></div></div><p class="help">저장 · 공개 배포 시 전체 플레이어의 다음 접속에 적용됩니다. 현재 진행 중인 게임은 기존 데이터로 유지됩니다. JSON으로 일괄 편집할 수 있습니다. 업로드 파일은 공개 미디어입니다. 사용 권한이 있는 자료만 등록하세요.</p></section></main><dialog id="cropDialog"><h3>원형 사진 크롭</h3><canvas id="cropCanvas" width="360" height="360"></canvas><label>확대 <input id="cropZoom" type="range" min="1" max="4" step=".01" value="1"></label><label>좌우 <input id="cropX" type="range" min="-1" max="1" step=".01" value="0"></label><label>상하 <input id="cropY" type="range" min="-1" max="1" step=".01" value="0"></label><button id="cropApply" class="primary">크롭 적용</button><button id="cropCancel">취소</button></dialog><dialog id="previewDialog"><div id="revealPreview"><img id="previewArt" alt=""><strong id="previewTitle"></strong></div><button id="previewClose">닫기</button></dialog><script src="src/data.js"></script><script src="src/cloud.js"></script><script src="src/catalog.js"></script><script src="src/studio.js"></script></body></html>
