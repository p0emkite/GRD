name: GRD premium art QA
on:
  push:
    paths:
      - 'src/premium-stage.js'
      - 'src/premium-art.css'
      - 'tests/art-smoke.mjs'
      - '.github/workflows/art-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and pinned 3D library
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1 three@0.180.0
          npx playwright install --with-deps chromium
      - name: Render all three venues and test fallback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/grd-art-http.log 2>&1 &
          node tests/art-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GRD-premium-art-QA
          path: art-qa/
