name: GRD mobile browser QA
on:
  push:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/mobile-smoke.mjs'
      - 'tests/battle-polish.mjs'
      - '.github/workflows/mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium webkit
      - name: Android Chromium and iPhone WebKit emulation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/grd-http.log 2>&1 &
          node tests/battle-polish.mjs
          node tests/mobile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GRD-mobile-QA-screenshots
          path: mobile-qa/
