name: GRD Native desktop
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Korean font fallback for preview
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Compile and test
        run: sh native/build.sh
      - name: Render native game frame
        run: java -Djava.awt.headless=true -jar native/build/GRD-Neon-Encore.jar --preview native/build/preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: GRD-Neon-Encore-JAR
          path: |
            native/build/GRD-Neon-Encore.jar
            native/build/preview.png
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test
        shell: pwsh
        run: ./native/build.ps1
      - name: Package portable PC app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/package-input | Out-Null
          Copy-Item native/build/GRD-Neon-Encore.jar native/package-input/
          jpackage --type app-image --name GRD --input native/package-input --main-jar GRD-Neon-Encore.jar --main-class grd.NativeClient --dest native/dist --app-version 0.1.0
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GRD-Windows-Portable
          path: native/dist/GRD/
